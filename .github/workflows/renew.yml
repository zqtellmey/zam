name: Zampto Auto Renew

on:
  schedule:
    - cron: '0 2,3 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装系统依赖及虚拟桌面环境
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils libxss1 libxi6 libgbm1

    - name: 安装 Python 依赖包
      run: |
        pip install seleniumbase requests pyvirtualdisplay

    - name: 安装并启动代理 (Xray VLESS+XHTTP TLS)
      env:
        PROXY_NODE: ${{ secrets.PROXY_NODE }}
      run: |
        if [ -z "$PROXY_NODE" ]; then
          echo "[INFO] 未配置代理，尝试直连模式..."
          exit 0
        fi

        # 1. 下载并安装最新的 Xray 核心
        TAG=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        wget -q "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
        unzip -q Xray-linux-64.zip
        chmod +x xray

        # 2. 解析 VLESS+XHTTP 节点并生成 config.json
        python3 << 'PYEOF'
        import os, json
        from urllib.parse import urlparse, parse_qs, unquote

        url = os.environ.get("PROXY_NODE", "").strip()
        p = urlparse(url)
        params = {k: v[0] for k, v in parse_qs(p.query).items()}

        raw_auth = unquote(p.netloc.split('@')[0] if '@' in p.netloc else "")
        uuid = raw_auth or p.username
        server = p.hostname
        port = int(p.port or 443)
        sni = params.get("sni", server)
        path = unquote(params.get("path", "/"))
        host = params.get("host", sni)

        # 动态读取链接中的跳过证书校验设置（如 allowInsecure=1 或 insecure=1）
        insecure_param = params.get("allowInsecure", params.get("insecure", "")).lower()
        allow_insecure = insecure_param in ["1", "true", "yes"]

        xhttp_settings = {
            "path": path,
            "host": host
        }
        if params.get("mode"):
            xhttp_settings["mode"] = params.get("mode")

        tls_settings = {
            "serverName": sni
        }
        if allow_insecure:
            tls_settings["allowInsecure"] = True

        outbound = {
            "protocol": "vless",
            "settings": {
                "vnext": [{
                    "address": server,
                    "port": port,
                    "users": [{"id": uuid, "encryption": "none"}]
                }]
            },
            "streamSettings": {
                "network": "xhttp",
                "security": "tls",
                "tlsSettings": tls_settings,
                "xhttpSettings": xhttp_settings
            }
        }

        config = {
            "log": {"loglevel": "info"},
            "inbounds": [{"port": 10808, "protocol": "socks", "settings": {"auth": "noauth"}}],
            "outbounds": [outbound]
        }

        with open("config.json", "w") as f:
            json.dump(config, f, indent=2)
        PYEOF

        # 3. 后台运行并等待握手
        ./xray run -c config.json > proxy.log 2>&1 &
        echo "[INFO] 正在等待代理建立连接 (15秒)..."
        sleep 15

        # 4. 连通性最终验证
        if curl -x socks5://127.0.0.1:10808 -s --max-time 15 https://www.google.com > /dev/null; then
          echo "[INFO] ✅ 代理适配成功！"
          echo "PROXY_SOCKS5=socks5://127.0.0.1:10808" >> $GITHUB_ENV
        else
          echo "[ERROR] ❌ 代理连接失败。"
          cat proxy.log
          exit 1
        fi

 

    - name: 初始化 SeleniumBase 浏览器核心
      run: seleniumbase install chromedriver

    - name: 执行续期脚本
      env:
        ZAMPTO_EMAIL: ${{ secrets.ZAMPTO_EMAIL }}
        ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        PROXY_SOCKS5: ${{ env.PROXY_SOCKS5 }}
      run: |
        python3 renew.py
